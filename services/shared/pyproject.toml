[project]
name = "control-plane-shared"
version = "0.1.0"
description = "Shared auth and bind-safety helpers for the homelab control plane's Flask apps"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
