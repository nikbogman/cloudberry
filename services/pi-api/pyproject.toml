[project]
name = "pi-api"
version = "0.1.0"
description = "Flask app on the Pi Zero that sends a Wake-on-LAN packet to the main server"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "control-plane-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
]

[tool.uv.sources]
control-plane-shared = { path = "../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
