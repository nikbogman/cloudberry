<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metal — asleep</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#EEF0F3}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; background: #0E0F12; color: #EEF0F3; font-family: 'Space Grotesk', system-ui, sans-serif; padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 20px">

  <header style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><polygon points="6,46 58,46 49,18 15,18" fill="#23262C" stroke="#C9CDD3" stroke-width="3" stroke-linejoin="round"></polygon><line x1="17" y1="37" x2="47" y2="37" stroke="#5C626C" stroke-width="4" stroke-linecap="round"></line></svg>
      <span style="font-size: 22px; font-weight: 600; letter-spacing: -0.03em">metal</span>
    </div>
    <button type="button" aria-label="Refresh" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2A2E35; background: #17191D; color: #C9CDD3; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path><path d="M8 16H3v5"></path></svg>
    </button>
  </header>

  <section style="background: #17191D; border: 1px solid #2A2E35; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 14px; height: 14px; border-radius: 50%; background: {{cool}}; box-shadow: 0 0 0 6px rgba(141,179,214,0.15)"></span>
      <span style="font-size: 44px; font-weight: 700; letter-spacing: -0.03em; line-height: 1">Asleep</span>
    </div>
    <p style="margin: 0; font-size: 15px; color: #B4BAC2">Since 11:48 · wakes on request</p>

    <button type="button" style="height: 60px; border-radius: 14px; border: 0; background: {{accent}}; color: #1A0E06; font: 700 18px 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 2v10"></path><path d="M18.4 6.6a9 9 0 1 1-12.8 0"></path></svg>
      Wake
    </button>
  </section>

  <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <div style="background: #17191D; border: 1px solid #2A2E35; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; color: #9AA0A8">Last wake</span>
      <span style="font-size: 20px; font-weight: 600">9.1s</span>
    </div>
    <div style="background: #17191D; border: 1px solid #2A2E35; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; color: #9AA0A8">On today</span>
      <span style="font-size: 20px; font-weight: 600">1h 33m</span>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 4px 4px 0; font-size: 14px; font-weight: 500; color: #9AA0A8">Stacks</h2>
    <a href="#" style="text-decoration: none; background: #17191D; border: 1px solid #2A2E35; border-radius: 14px; padding: 0 16px; display: flex; align-items: center; gap: 12px; min-height: 52px">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: {{cool}}"></span>
      <span style="flex: 1; font-size: 16px; color: #EEF0F3">immich</span>
      <span style="font-size: 13px; color: #9AA0A8">sleeping</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA0A8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg>
    </a>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 4px 4px 0; font-size: 14px; font-weight: 500; color: #9AA0A8">Automation</h2>
    <div style="background: #17191D; border: 1px solid #2A2E35; border-radius: 14px; display: flex; flex-direction: column">
      <label style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px; min-height: 52px; border-bottom: 1px solid #2A2E35; font-size: 16px">
        <span>Auto-wake</span>
        <input type="checkbox" role="switch" checked style="width: 22px; height: 22px; accent-color: {{accent}}">
      </label>
      <label style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px; min-height: 52px; font-size: 16px">
        <span>Auto-suspend</span>
        <input type="checkbox" role="switch" checked style="width: 22px; height: 22px; accent-color: {{accent}}">
      </label>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 4px 4px 0; font-size: 14px; font-weight: 500; color: #9AA0A8">Today</h2>
    <ol style="list-style: none; margin: 0; padding: 4px 16px; background: #17191D; border: 1px solid #2A2E35; border-radius: 14px; display: flex; flex-direction: column">
      <li style="display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #2A2E35; font-size: 15px">
        <span style="color: #9AA0A8; width: 44px">11:48</span>
        <span style="color: {{cool}}">Suspended</span>
      </li>
      <li style="display: flex; gap: 12px; padding: 12px 0; font-size: 15px">
        <span style="color: #9AA0A8; width: 44px">10:15</span>
        <span style="color: {{accent}}">Woke</span>
      </li>
    </ol>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6B2C","options":["#FF6B2C","#FFB020","#E5484D"]},"cool":{"editor":"color","default":"#8DB3D6"},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF6B2C', cool: this.props.cool ?? '#8DB3D6' };
  }
}
</script>
</body>
</html>
