# Converges raspberry (gateway) and blackberry (hostd, Docker, HDD spindown, network, stack firewall) over plain ssh.
# `task ui` deploys the UI to Cloudflare Pages; it isn't part of `task`.
# Every run re-ships both binaries and restarts both services -- no diffing.
# See DEPLOY.md.
version: '3'

dotenv: ['.env']

vars:
  RASPBERRY: ${RASPBERRY_SSH_USER:-pi}@${RASPBERRY_HOST:-raspberry}
  BLACKBERRY: ${BLACKBERRY_SSH_USER:-admin}@${BLACKBERRY_HOST:-blackberry}

tasks:
  default:
    desc: Converge both devices (Docker, HDD spindown, network, firewall, gateway, hostd)
    cmds:
      - task: docker
      - task: hdd
      - task: network
      - task: firewall
      - task: gateway
      - task: hostd

  tailscale:
    desc: Install Tailscale and join the tailnet on both devices (needs TAILSCALE_AUTH_KEY on first join)
    cmds:
      - for: [RASPBERRY, BLACKBERRY]
        task: _root
        vars:
          DEVICE: '{{.ITEM}}'
          CMD: >-
            (command -v tailscale >/dev/null || curl -fsSL https://tailscale.com/install.sh | sh)
            && systemctl enable --now tailscaled
            && (tailscale status >/dev/null 2>&1 || tailscale up --ssh --authkey=${TAILSCALE_AUTH_KEY:-})

  docker:
    desc: Install and enable the Docker engine on blackberry
    cmds:
      - task: _root
        vars:
          DEVICE: BLACKBERRY
          CMD: (command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh) && systemctl enable --now docker

  network:
    desc: Install blackberry's netplan config (deployments/blackberry/netplan.yaml); rolls back by itself if blackberry drops off
    cmds:
      - scp deployments/blackberry/netplan.yaml deployments/blackberry/netplan-apply.sh {{.BLACKBERRY}}:/tmp/
      - task: _root
        vars:
          DEVICE: BLACKBERRY
          CMD: sh /tmp/netplan-apply.sh
      # A fresh ssh session proves blackberry is still on the network; only then cancel the rollback.
      - sleep 15
      - task: _root
        vars:
          DEVICE: BLACKBERRY
          CMD: systemctl stop netplan-rollback.timer

  firewall:
    desc: Allow gated stack ports on blackberry only from raspberry (deployments/blackberry/stack-firewall.service)
    cmds:
      - scp deployments/blackberry/stack-firewall.service {{.BLACKBERRY}}:/tmp/
      - task: _root
        vars:
          DEVICE: BLACKBERRY
          CMD: >-
            install -m644 /tmp/stack-firewall.service /etc/systemd/system/stack-firewall.service
            && rm -f /tmp/stack-firewall.service
            && systemctl daemon-reload && systemctl enable stack-firewall && systemctl restart stack-firewall

  hdd:
    desc: Spin blackberry's HDD down when idle (hd-idle, settings in deployments/blackberry/hd-idle)
    cmds:
      - scp deployments/blackberry/hd-idle deployments/blackberry/hd-idle.sleep {{.BLACKBERRY}}:/tmp/
      - task: _root
        vars:
          DEVICE: BLACKBERRY
          CMD: >-
            (command -v hd-idle >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get install -y -qq hd-idle)
            && install -m644 /tmp/hd-idle /etc/default/hd-idle
            && install -m755 /tmp/hd-idle.sleep /usr/lib/systemd/system-sleep/hd-idle
            && rm -f /tmp/hd-idle /tmp/hd-idle.sleep
            && systemctl enable hd-idle && systemctl restart hd-idle

  gateway:
    desc: Build and deploy gateway (routes from cmd/gateway/routes.json) to raspberry
    cmds:
      - scp cmd/gateway/routes.json {{.RASPBERRY}}:/tmp/gateway-routes.json
      - task: _root
        vars:
          DEVICE: RASPBERRY
          CMD: install -D -m644 /tmp/gateway-routes.json /etc/gateway/routes.json && rm -f /tmp/gateway-routes.json
      - task: _service
        vars:
          DEVICE: RASPBERRY
          BIN: gateway
          # Pi Zero W is ARM1176 (armv6). A Pi Zero 2 W would need GOARCH=arm64.
          GOENV: GOARCH=arm GOARM=6
          DESC: gateway -- Wake-on-LAN for blackberry, and wake-on-request proxy to its stacks
          # Serves /wake on 443. Stack routes publish their own ports at startup.
          PORT: ${GATEWAY_PORT:-5000}
          ENV: |
            Environment=GATEWAY_PORT=${GATEWAY_PORT:-5000}
            Environment=BLACKBERRY_MAC_ADDRESS=${BLACKBERRY_MAC_ADDRESS:?set BLACKBERRY_MAC_ADDRESS}
            Environment=HOSTD_URL=${HOSTD_URL:?set HOSTD_URL}
            Environment=UI_ORIGIN=${UI_ORIGIN:?set UI_ORIGIN}

  hostd:
    desc: Build and deploy hostd to blackberry
    cmds:
      - task: _service
        vars:
          DEVICE: BLACKBERRY
          BIN: hostd
          # dpkg and Go agree on amd64/arm64; anything else fails in go build.
          GOENV: GOARCH=$(ssh {{.BLACKBERRY}} dpkg --print-architecture)
          DESC: hostd -- blackberry's own daemon (suspend, reachability health check)
          PORT: ${HOSTD_PORT:-5000}
          ENV: |
            Environment=HOSTD_PORT=${HOSTD_PORT:-5000}
            Environment=UI_ORIGIN=${UI_ORIGIN:?set UI_ORIGIN}

  ui:
    desc: Deploy the UI to Cloudflare Pages (needs Node for npx wrangler; first run asks you to log in)
    cmds:
      - rm -rf dist/ui && mkdir -p dist/ui
      - cp -r ui/index.html ui/app.js ui/style.css ui/site.webmanifest ui/icons dist/ui/
      - >-
        printf 'export default { gatewayBaseUrl: "%s", hostdBaseUrl: "%s" }\n'
        "${GATEWAY_URL:?set GATEWAY_URL}" "${HOSTD_URL:?set HOSTD_URL}" > dist/ui/config.js
      - npx wrangler pages deploy dist/ui --project-name=${CLOUDFLARE_PAGES_PROJECT:-cloudberry} --branch=main

  cleanup:
    desc: 'Stop and remove a service left behind by a rename: task cleanup DEVICE=RASPBERRY|BLACKBERRY OLD=<old-binary-name>'
    requires:
      vars:
        - name: DEVICE
          enum: [RASPBERRY, BLACKBERRY]
        - OLD
    cmds:
      - task: _root
        vars:
          DEVICE: '{{.DEVICE}}'
          CMD: >-
            systemctl disable --now {{.OLD}} ;
            rm -f /etc/systemd/system/{{.OLD}}.service /usr/local/bin/{{.OLD}} /usr/local/bin/{{.OLD}}.new
            && systemctl daemon-reload && systemctl reset-failed

  # Cross-compiles on the dev machine (no Go toolchain on either device),
  # ships the binary + unit, swaps the binary in with mv (overwriting a
  # running binary in place hits ETXTBSY), restarts, and serves it on the
  # tailnet.
  _service:
    internal: true
    cmds:
      - GOOS=linux {{.GOENV}} go build -o dist/{{.BIN}} ./cmd/{{.BIN}}
      - |
        cat > dist/{{.BIN}}.service <<EOF
        [Unit]
        Description={{.DESC}}
        After=network-online.target
        Wants=network-online.target

        [Service]
        Type=simple
        {{.ENV}}Environment=GRAFANA_CLOUD_LOKI_URL=${GRAFANA_CLOUD_LOKI_URL:?set GRAFANA_CLOUD_LOKI_URL}
        Environment=GRAFANA_CLOUD_LOKI_USER=${GRAFANA_CLOUD_LOKI_USER:?set GRAFANA_CLOUD_LOKI_USER}
        Environment=GRAFANA_CLOUD_LOKI_API_KEY=${GRAFANA_CLOUD_LOKI_API_KEY:?set GRAFANA_CLOUD_LOKI_API_KEY}
        ExecStart=/usr/local/bin/{{.BIN}}
        Restart=on-failure
        RestartSec=5
        User=root

        [Install]
        WantedBy=multi-user.target
        EOF
      - scp dist/{{.BIN}} dist/{{.BIN}}.service {{get . .DEVICE}}:/tmp/
      - task: _root
        vars:
          DEVICE: '{{.DEVICE}}'
          CMD: >-
            install -m755 /tmp/{{.BIN}} /usr/local/bin/{{.BIN}}.new
            && mv -f /usr/local/bin/{{.BIN}}.new /usr/local/bin/{{.BIN}}
            && install -m644 /tmp/{{.BIN}}.service /etc/systemd/system/{{.BIN}}.service
            && rm -f /tmp/{{.BIN}} /tmp/{{.BIN}}.service
            && systemctl daemon-reload && systemctl enable {{.BIN}} && systemctl restart {{.BIN}}
            {{if .PORT}}&& tailscale serve --bg --https=443 localhost:{{.PORT}}{{end}}

  # Runs CMD as root on DEVICE. The device's <DEVICE>_SUDO_PASSWORD, if set,
  # goes to sudo on stdin (sudo-rs on blackberry needs it); sudo ignores
  # stdin when no password is required. CMD must not contain single quotes.
  _root:
    internal: true
    cmd: printf '%s\n' "${{.DEVICE}}_SUDO_PASSWORD" | ssh {{get . .DEVICE}} "sudo -S -p '' sh -c '{{.CMD}}'"
