services:
  caddy:
    image: ghcr.io/tailscale/caddy-tailscale:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/stacks/caddy/data:/data
    networks:
      - stacks

networks:
  stacks:
    external: true
