# Popcorn's API server (github.com/nikbogman/watchlist, server/), with the
# Chromium its reel scraper drives. Built on blackberry straight from GitHub,
# so there's no registry; `up -d --build` picks up new commits on main.
# Gated: reached through gateway at raspberry's /popcorn, so no Caddy and no
# `stacks` network.
name: popcorn

services:
  server:
    build: https://github.com/nikbogman/watchlist.git#main:server
    # DATABASE_URL (from stacks/db/new-database.sh), LOGIN_PASSWORD,
    # TMDB_API_KEY, GEMINI_API_KEY, POPCORN_BIND_IP.
    env_file:
      - .env
    environment:
      PORT: '3000'
    ports:
      # Bound to blackberry's LAN IP so only raspberry's gateway can reach it.
      # Match `upstream` in cmd/gateway/routes.json.
      - '${POPCORN_BIND_IP:?set POPCORN_BIND_IP}:3000:3000'
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    external: true
