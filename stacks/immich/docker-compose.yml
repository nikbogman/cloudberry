# Adapted from https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
# Machine learning is dropped on purpose; also switch it off once in the
# admin UI (Administration > Settings > Machine Learning), or its jobs error.
# Gated: reached through gateway on raspberry, so no Caddy and no `stacks` network.
name: immich

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    volumes:
      # Photos, thumbnails and transcodes all live under /data, so this one
      # mount puts the whole library on the HDD. Long form with
      # create_host_path off: if the HDD isn't mounted, the container fails
      # to start instead of silently filling the SSD with an empty directory.
      - type: bind
        source: ${UPLOAD_LOCATION}
        target: /data
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      # Bound to blackberry's LAN IP so only raspberry's gateway (same LAN) and
      # not every interface can reach it. Match `upstream` in cmd/gateway/routes.json.
      - '${IMMICH_BIND_IP:?set IMMICH_BIND_IP}:2283:2283'
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false

  redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false
