# Shared Postgres and Valkey for every stack on blackberry. Stacks reach them
# as `postgres:5432` and `valkey:6379` by joining the `db` network
# (external: true); no ports are published.
name: db

services:
  postgres:
    # The official Postgres image plus pgvector, which Immich needs for its
    # vector columns (it auto-detects pgvector; VectorChord isn't required
    # with machine learning off). Plain Postgres 17 for every other stack.
    image: docker.io/pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      # Only read when the data directory is empty, on first start.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - /srv/stacks/db/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: pg_isready -U postgres -q
    restart: unless-stopped
    networks:
      - db

  valkey:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    volumes:
      - /srv/stacks/db/valkey:/data
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped
    networks:
      - db

networks:
  db:
    name: db
