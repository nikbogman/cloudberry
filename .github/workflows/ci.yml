# Every push: vet, test, and cross-build both binaries. A v* tag also
# publishes a release; gateway and hostd release builds poll for the latest
# one and swap themselves to it (internal/selfupdate).
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build release assets
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          mkdir -p dist
          ldflags="-X main.version=${GITHUB_REF_NAME}"
          # Asset names are <bin>-linux-<GOARCH>, what selfupdate looks for.
          # raspberry is a Pi Zero W (armv6); blackberry is amd64.
          GOARCH=arm GOARM=6 go build -ldflags "$ldflags" -o dist/gateway-linux-arm ./cmd/gateway
          GOARCH=amd64 go build -ldflags "$ldflags" -o dist/hostd-linux-amd64 ./cmd/hostd
          cd dist && sha256sum gateway-linux-arm hostd-linux-amd64 > SHA256SUMS
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
    permissions:
      contents: write
